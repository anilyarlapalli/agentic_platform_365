[alembic]
script_location = deploy/migrations
prepend_sys_path = .
# UTC, zero-padded, sortable. A migration filename that sorts differently from
# its dependency order is a merge conflict waiting to be resolved wrongly.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is deliberately absent: env.py reads database_owner_url from
# the validated settings object. A URL in this file is a URL that drifts from
# the one the application uses, and on the migration path that drift is silent.

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
