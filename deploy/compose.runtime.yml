# Production-shaped local runtime. Combine with the substrate:
#   docker compose -f deploy/compose.yml -f deploy/compose.runtime.yml up --build
#
# This overlay demonstrates process and credential separation. It intentionally
# uses local-only defaults; Kubernetes/managed deployments must inject secrets
# from a secret manager and use ENVIRONMENT=production.

x-python-runtime: &python-runtime
  image: local-platform:${RELEASE:-dev}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      RELEASE: ${RELEASE:-dev}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 35m

x-runtime-common-environment: &runtime-common-environment
  ENVIRONMENT: local
  RELEASE: ${RELEASE:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  OTLP_ENDPOINT: http://otel-collector:4317
  TELEMETRY_ENABLED: "true"

services:
  migrate:
    <<: *python-runtime
    restart: "no"
    command: ["python", "-m", "apps.migrator.main"]
    environment:
      <<: *runtime-common-environment
      SERVICE_ROLE: migrator
      DATABASE_OWNER_URL: postgresql+psycopg://platform_owner:${POSTGRES_PASSWORD:-platform_dev_only}@postgres:5432/platform
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:-local-telemetry-hmac-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  api:
    <<: *python-runtime
    restart: unless-stopped
    command: ["python", "-m", "apps.api.main"]
    environment:
      <<: *runtime-common-environment
      SERVICE_ROLE: api
      DATABASE_URL: postgresql+psycopg://platform_app:${POSTGRES_PASSWORD:-platform_dev_only}@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-platform}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-platform_dev_only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret-padded-to-32+}
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:-local-telemetry-hmac-key-change-me}
      BROWSER_ALLOWED_ORIGINS: '["http://127.0.0.1:${WEB_PORT:-3000}","http://localhost:${WEB_PORT:-3000}"]'
      TRUSTED_PROXY_IPS: 127.0.0.1,172.16.0.0/12
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8100}:8100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    cpus: 2
    mem_limit: 2g

  worker:
    <<: *python-runtime
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "apps.worker.tasks",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--queues=runs",
      ]
    environment:
      <<: *runtime-common-environment
      SERVICE_ROLE: worker
      DATABASE_URL: postgresql+psycopg://platform_app:${POSTGRES_PASSWORD:-platform_dev_only}@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-platform}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-platform_dev_only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:-local-telemetry-hmac-key-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpus: 4
    mem_limit: 4g

  maintenance:
    <<: *python-runtime
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "apps.worker.tasks",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--queues=maintenance",
      ]
    environment:
      <<: *runtime-common-environment
      SERVICE_ROLE: maintenance
      DATABASE_RELAY_URL: postgresql+psycopg://platform_relay:${POSTGRES_PASSWORD:-platform_dev_only}@postgres:5432/platform
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:-local-telemetry-hmac-key-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g

  scheduler:
    <<: *python-runtime
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "apps.worker.tasks",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      <<: *runtime-common-environment
      SERVICE_ROLE: scheduler
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:-local-telemetry-hmac-key-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m

  relay:
    <<: *python-runtime
    restart: unless-stopped
    command: ["python", "-m", "apps.relay.main"]
    environment:
      <<: *runtime-common-environment
      SERVICE_ROLE: relay
      DATABASE_RELAY_URL: postgresql+psycopg://platform_relay:${POSTGRES_PASSWORD:-platform_dev_only}@postgres:5432/platform
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEMETRY_HMAC_KEY: ${TELEMETRY_HMAC_KEY:-local-telemetry-hmac-key-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpus: 1
    mem_limit: 1g

  web:
    image: local-platform-web:${RELEASE:-dev}
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        API_ORIGIN: http://api:8100
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    cpus: 1
    mem_limit: 512m
