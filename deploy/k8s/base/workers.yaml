apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-scheduler
  labels:
    app.kubernetes.io/name: platform-scheduler
    app.kubernetes.io/component: scheduler
spec:
  # Duplicate sweep deliveries are safe: database row locks and idempotency
  # choose the work. Two beat replicas avoid a singleton scheduler outage.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-scheduler
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/version: unreleased
    spec:
      serviceAccountName: platform-scheduler
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-scheduler
      containers:
        - name: scheduler
          image: registry.example.invalid/local-platform:unreleased
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - celery
            - -A
            - apps.worker.tasks
            - beat
            - --loglevel=INFO
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: platform-runtime-config
          env:
            - name: SERVICE_ROLE
              value: scheduler
            - name: RELEASE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: platform-scheduler-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: platform-scheduler-secrets
                  key: celery-result-backend
            - name: TELEMETRY_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-scheduler-secrets
                  key: telemetry-hmac-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
