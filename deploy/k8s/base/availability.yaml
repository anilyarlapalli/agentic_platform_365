apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-worker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-relay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-relay
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-maintenance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-maintenance
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-scheduler
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-scheduler
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-api
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-web
  minReplicas: 3
  maxReplicas: 15
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

